<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" >
    <defs>
      <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#EEF3EE"/>
        <stop offset="1" stop-color="#FAF7F2"/>
      </linearGradient>
      <linearGradient id="stoneg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6B9080"/>
        <stop offset="1" stop-color="#3F5B4E"/>
      </linearGradient>
    </defs>
    <rect width="640" height="640" rx="48" fill="url(#skyg)"/>
    <circle cx="520" cy="110" r="70" fill="#F2C94C" opacity="0.5"/>
    <circle cx="90" cy="90" r="46" fill="#E8956B" opacity="0.25"/>

    <path id="dotpath" d="M90 480 C 180 420, 150 340, 250 320 S 380 380, 430 280 S 380 150, 520 130"
          stroke="#3F5B4E" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.55"/>

    <!-- milestone stones -->
    <g>
      <circle cx="90" cy="480" r="34" fill="url(#stoneg)"/>
      <text x="90" y="487" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" fill="#FAF7F2">1</text>
    </g>
    <g>
      <circle cx="250" cy="320" r="30" fill="#E8956B"/>
      <text x="250" y="327" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#FFFFFF">2</text>
    </g>
    <g>
      <circle cx="430" cy="280" r="34" fill="#F2C94C"/>
      <text x="430" y="287" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" fill="#2B2438">3</text>
    </g>
    <g>
      <circle cx="520" cy="130" r="38" fill="url(#stoneg)"/>
      <text x="520" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" fill="#FAF7F2">4</text>
    </g>

    <!-- simple child figure near stone 1 -->
    <g transform="translate(60,420)">
      <circle cx="30" cy="18" r="14" fill="#2B2438" opacity="0.85"/>
      <path d="M14 40 Q30 20 46 40 L46 70 Q30 80 14 70 Z" fill="#E8956B"/>
    </g>
    <!-- scattered soft dots -->
    <circle cx="580" cy="380" r="6" fill="#6B9080" opacity="0.5"/>
    <circle cx="140" cy="200" r="5" fill="#E8956B" opacity="0.5"/>
    <circle cx="360" cy="500" r="7" fill="#F2C94C" opacity="0.6"/>
    </svg>